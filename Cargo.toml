[package]
name = "toryo"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "Toryo (棟梁) — orchestrates Claude Code and Codex through a bounded, verified workflow (M0 spike kit, plan v0.7)"
license = "UNLICENSED"
publish = false

[[bin]]
name = "toryo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
regex = "1"
aho-corasick = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
